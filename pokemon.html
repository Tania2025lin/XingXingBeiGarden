<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精灵宝贝_属性克制查询器</title>
    <style>
        /* CSS 样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); padding: 30px; width: 100%; max-width: 500px; }
        h1 { text-align: center; color: #333; font-size: 24px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 20px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #667eea; }
        button { padding: 12px 24px; background: #667eea; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; font-weight: bold; }
        button:hover { background: #5a6fd6; }
        .result-box { background: #f8f9fc; border-radius: 12px; padding: 20px; }
        .result-box h2 { font-size: 18px; color: #333; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .result-item { margin-bottom: 12px; font-size: 15px; line-height: 1.6; }
        .result-item span.label { font-weight: bold; color: #555; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 13px; margin-right: 5px; margin-bottom: 4px; font-weight: 500; }
        .tag-4x { background: #ff4d4f; color: white; }
        .tag-2x { background: #ff7875; color: white; }
        .tag-05x { background: #52c41a; color: white; }
        .tag-025x { background: #95de64; color: #333; }
        .tag-0x { background: #bfbfbf; color: white; }
        .footer { text-align: center; color: #aaa; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>精灵宝贝_属性克制查询器⚔️</h1>
        <p class="subtitle">输入宠物属性（如：飞, 钢）点击查询</p>
        <div class="search-box">
            <input type="text" id="typeInput" placeholder="例如: 水, 超" autocomplete="off">
            <button id="searchBtn">查询</button>
        </div>
        <div id="resultBox" class="result-box" style="display: none;"></div>
        <p class="footer"> T.ania | 属性数据基于第九世代 | 精确到双属性修正</p>
    </div>

    <script>
        // JS 逻辑
        const matrix = {
            "一般": {"一般":1, "格":1, "飞":1, "毒":1, "地":1, "岩":0.5, "虫":1, "幽":0, "钢":0.5, "火":1, "水":1, "草":1, "电":1, "超":1, "冰":1, "龙":1, "恶":1, "妖":1},
            "格": {"一般":2, "格":1, "飞":0.5, "毒":0.5, "地":1, "岩":2, "虫":0.5, "幽":0, "钢":2, "火":1, "水":1, "草":1, "电":1, "超":0.5, "冰":2, "龙":1, "恶":2, "妖":0.5},
            "飞": {"一般":1, "格":2, "飞":1, "毒":1, "地":1, "岩":0.5, "虫":2, "幽":1, "钢":0.5, "火":1, "水":1, "草":2, "电":0.5, "超":1, "冰":1, "龙":1, "恶":1, "妖":1},
            "毒": {"一般":1, "格":1, "飞":1, "毒":0.5, "地":0.5, "岩":0.5, "虫":1, "幽":0.5, "钢":0, "火":1, "水":1, "草":2, "电":1, "超":1, "冰":1, "龙":1, "恶":1, "妖":2},
            "地": {"一般":1, "格":1, "飞":0, "毒":2, "地":1, "岩":2, "虫":0.5, "幽":1, "钢":2, "火":2, "水":1, "草":0.5, "电":2, "超":1, "冰":1, "龙":1, "恶":1, "妖":1},
            "岩": {"一般":1, "格":0.5, "飞":2, "毒":1, "地":0.5, "岩":1, "虫":2, "幽":1, "钢":0.5, "火":2, "水":1, "草":1, "电":1, "超":1, "冰":2, "龙":1, "恶":1, "妖":1},
            "虫": {"一般":1, "格":0.5, "飞":0.5, "毒":0.5, "地":1, "岩":1, "虫":1, "幽":0.5, "钢":0.5, "火":0.5, "水":1, "草":2, "电":1, "超":2, "冰":1, "龙":1, "恶":2, "妖":0.5},
            "幽": {"一般":0, "格":1, "飞":1, "毒":1, "地":1, "岩":1, "虫":1, "幽":2, "钢":1, "火":1, "水":1, "草":1, "电":1, "超":2, "冰":1, "龙":1, "恶":0.5, "妖":1},
            "钢": {"一般":1, "格":1, "飞":1, "毒":1, "地":1, "岩":2, "虫":1, "幽":1, "钢":0.5, "火":0.5, "水":0.5, "草":1, "电":0.5, "超":1, "冰":2, "龙":1, "恶":1, "妖":2},
            "火": {"一般":1, "格":1, "飞":1, "毒":1, "地":1, "岩":0.5, "虫":2, "幽":1, "钢":2, "火":0.5, "水":0.5, "草":2, "电":1, "超":1, "冰":2, "龙":0.5, "恶":1, "妖":1},
            "水": {"一般":1, "格":1, "飞":1, "毒":1, "地":2, "岩":2, "虫":1, "幽":1, "钢":1, "火":2, "水":0.5, "草":0.5, "电":1, "超":1, "冰":1, "龙":0.5, "恶":1, "妖":1},
            "草": {"一般":1, "格":1, "飞":0.5, "毒":0.5, "地":2, "岩":2, "虫":0.5, "幽":1, "钢":0.5, "火":0.5, "水":2, "草":0.5, "电":1, "超":1, "冰":1, "龙":0.5, "恶":1, "妖":1},
            "电": {"一般":1, "格":1, "飞":2, "毒":1, "地":0, "岩":1, "虫":1, "幽":1, "钢":1, "火":1, "水":2, "草":0.5, "电":0.5, "超":1, "冰":1, "龙":0.5, "恶":1, "妖":1},
            "超": {"一般":1, "格":2, "飞":1, "毒":2, "地":1, "岩":1, "虫":1, "幽":1, "钢":0.5, "火":1, "水":1, "草":1, "电":1, "超":0.5, "冰":1, "龙":1, "恶":0, "妖":1},
            "冰": {"一般":1, "格":1, "飞":2, "毒":1, "地":2, "岩":1, "虫":1, "幽":1, "钢":0.5, "火":0.5, "水":0.5, "草":2, "电":1, "超":1, "冰":0.5, "龙":2, "恶":1, "妖":1},
            "龙": {"一般":1, "格":1, "飞":1, "毒":1, "地":1, "岩":1, "虫":1, "幽":1, "钢":0.5, "火":1, "水":1, "草":1, "电":1, "超":1, "冰":1, "龙":2, "恶":1, "妖":0},
            "恶": {"一般":1, "格":0.5, "飞":1, "毒":1, "地":1, "岩":1, "虫":1, "幽":2, "钢":0.5, "火":1, "水":1, "草":1, "电":1, "超":2, "冰":1, "龙":1, "恶":0.5, "妖":0.5},
            "妖": {"一般":1, "格":2, "飞":1, "毒":0.5, "地":1, "岩":1, "虫":1, "幽":1, "钢":0.5, "火":0.5, "水":1, "草":1, "电":1, "超":1, "冰":1, "龙":2, "恶":2, "妖":1}
        };

        const nameMap = {
            "一般":"一般", "格斗":"格", "飞行":"飞", "毒":"毒",
            "地面":"地", "岩石":"岩", "虫":"虫", "幽灵":"幽",
            "钢":"钢", "火":"火", "水":"水", "草":"草",
            "电":"电", "超能力":"超", "冰":"冰", "龙":"龙",
            "恶":"恶", "妖精":"妖"
        };

        function searchTypes(inputVal) {
            let rawTypes = inputVal.split(/[\s,，、]+/).filter(t => t.trim() !== "");
            if (rawTypes.length === 0) { alert("请输入至少一个属性！"); return; }

            let targetTypes = rawTypes.map(t => {
                let mapped = nameMap[t.trim()];
                return mapped ? mapped : t.trim();
            });

            let results = {};
            for (let atk in matrix) { results[atk] = 1.0; }

            for (let def of targetTypes) {
                if (!matrix[def]) {
                    alert(`属性 "${def}" 无效！请检查拼写。可输入全称或简称（如：飞行/飞）。`);
                    return;
                }
                for (let atk in matrix) { results[atk] *= matrix[atk][def]; }
            }

            let weak4x = [], weak2x = [], normal = [], resist05x = [], resist025x = [], immune = [];
            for (let atk in results) {
                let m = results[atk];
                if (m === 4) weak4x.push(atk);
                else if (m === 2) weak2x.push(atk);
                else if (m === 1) normal.push(atk);
                else if (m === 0.5) resist05x.push(atk);
                else if (m === 0.25) resist025x.push(atk);
                else if (m === 0) immune.push(atk);
            }

            let resultBox = document.getElementById("resultBox");
            let html = `<h2>目标属性: ${rawTypes.join(" + ")}</h2>`;
            const renderTags = (arr, className) => {
                return arr.length > 0 ? arr.map(t => `<span class="tag ${className}">${t}</span>`).join("") : "无";
            };

            html += `<div class="result-item"><span class="label">🔥 4倍克制：</span>${renderTags(weak4x, 'tag-4x')}</div>`;
            html += `<div class="result-item"><span class="label">⚡ 2倍克制：</span>${renderTags(weak2x, 'tag-2x')}</div>`;
            html += `<div class="result-item"><span class="label">🛡️ 0.5倍抵抗：</span>${renderTags(resist05x, 'tag-05x')}</div>`;
            html += `<div class="result-item"><span class="label">🛡️ 0.25倍抵抗：</span>${renderTags(resist025x, 'tag-025x')}</div>`;
            html += `<div class="result-item"><span class="label">🚫 0倍免疫：</span>${renderTags(immune, 'tag-0x')}</div>`;

            resultBox.innerHTML = html;
            resultBox.style.display = "block";
        }

        document.getElementById("searchBtn").addEventListener("click", () => {
            searchTypes(document.getElementById("typeInput").value);
        });

        document.getElementById("typeInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") { searchTypes(document.getElementById("typeInput").value); }
        });
    </script>
</body>
</html>
